services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stokvel
      POSTGRES_USER: stokvel
      POSTGRES_PASSWORD: stokvel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokvel -d stokvel"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/stokvel
      DB_USER: stokvel
      DB_PASSWORD: stokvel
      COOKIE_SECURE: "false"   # plain http on localhost
      SEED_ENABLED: "true"     # demo accounts for local use
    ports: ["8080:8080"]
volumes:
  pgdata:
