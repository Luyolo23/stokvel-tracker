server.port=${PORT:8080}

# Database (hosted Postgres in production, docker-compose Postgres locally)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stokvel}
spring.datasource.username=${DB_USER:stokvel}
spring.datasource.password=${DB_PASSWORD:stokvel}
spring.datasource.hikari.maximum-pool-size=5

# Schema is auto-updated for speed. Next step: Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session cookie hardening (CSRF is disabled, so SameSite=Strict matters)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=2h
server.forward-headers-strategy=framework

# Demo data: every seeded account uses this password (made-up data only)
app.seed.password=${SEED_PASSWORD:Stokvel2026!}
